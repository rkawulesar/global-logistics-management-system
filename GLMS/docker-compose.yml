services:
  glms-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - glms_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  glms-api:
    build:
      context: .
      dockerfile: GLMS_API/Dockerfile
    container_name: glms-api
    depends_on:
      glms-db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=glms-db,1433;Database=GLMS_DB;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      Jwt__Issuer: "GLMS_API"
      Jwt__Audience: "GLMS_MVC"
      ExchangeRateApi__ApiKey: "${EXCHANGE_API_KEY}"
    ports:
      - "5001:8080"
    volumes:
      - glms_uploads:/app/wwwroot/files
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  glms-web:
    build:
      context: .
      dockerfile: GLMS_Web/Dockerfile
    container_name: glms-web
    depends_on:
      glms-api:
        condition: service_started
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ApiSettings__BaseUrl: "http://glms-api:8080/api/"
      ApiSettings__PublicBaseUrl: "http://localhost:5001"
    ports:
      - "5000:8080"

volumes:
  glms_sql_data:
  glms_uploads: