name: .NET CI/CD

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore GLMS/GLMS.slnx

    - name: Build
      run: dotnet build GLMS/GLMS.slnx --no-restore --configuration Release

    - name: Run Test
      run: dotnet test GLMS/GLMS_Tests/GLMS_Tests.csproj --no-build --verbosity normal